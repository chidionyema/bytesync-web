# Deploys the static export to Cloudflare Pages (free rung, idp ADR 0034 §2 row 4).
# Secrets by name only: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID come from the
# repository's secrets, seeded from the estate vault. Nothing here names a key.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  deployments: write
concurrency: deploy-production
jobs:
  pages:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      - run: npx --yes wrangler@4 pages deploy out --project-name "${{ vars.CF_PAGES_PROJECT || 'bytesync' }}" --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: prove it answers
        run: |
          url="${{ vars.SITE_URL || 'https://bytesync.pages.dev' }}"
          for p in / /research/ /companies/ /about/ /contact/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$p"); echo "$code $url$p"; [ "$code" = 200 ] || exit 1
          done
